# The minute hand Populr never had.
#
# app/api/cron/automation-publish carries a comment explaining that it is deliberately not in
# vercel.json: the Hobby plan allows two cron jobs at daily granularity, and a once-a-day
# publishing cron is not a schedule. It says the endpoint is "driven by an external scheduler
# instead". That scheduler was never built, so nothing has ever dispatched a scheduled post —
# the queue fills and no hand moves.
#
# This is that scheduler. GitHub Actions is used because it is free, lives beside the code,
# and needs no third-party account. What it is not is punctual: scheduled workflows are
# best-effort and routinely run five to fifteen minutes late when GitHub is busy, and they
# are disabled automatically after 60 days without a push to the repository.
#
# Both of those are acceptable for "post within the hour" and not acceptable for "post at
# 09:00 sharp". When timing starts to matter, move this to Upstash QStash or a Vercel Pro
# cron at "* * * * *" and delete this file. The endpoints do not change either way.

name: Publishing scheduler

on:
  schedule:
    # Every five minutes. The endpoints are idempotent — each asks its engine for work that
    # is due and does nothing when there is none — so an early or duplicated run is harmless.
    - cron: "*/5 * * * *"
  # So a deploy can be verified immediately rather than waiting for the next tick.
  workflow_dispatch:

# Two overlapping runs would ask for the same due work twice. The engines are safe against
# it, but the logs stop being readable, so let one finish first.
concurrency:
  group: publishing-scheduler
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      BASE: https://www.trypopulr.in
    steps:
      # Not configured is not the same as broken.
      #
      # This used to error and exit 1 when CRON_SECRET was missing, which meant a red run
      # every five minutes for as long as the secret went unset — a notification stream that
      # says nothing except "you have not done the setup yet", and the fastest way to teach
      # someone to ignore this workflow entirely. The run now succeeds and says what it is
      # waiting for, so a genuine failure later still stands out.
      - name: Waiting for setup
        if: env.CRON_SECRET == ''
        run: |
          echo "::notice::CRON_SECRET is not set, so nothing was dispatched."
          echo "Add it under Settings → Secrets and variables → Actions, matching the value in Vercel."
          echo "Until then scheduled posts stay queued — they are not lost, just not sent."
          {
            echo "### Scheduler idle"
            echo ""
            echo "\`CRON_SECRET\` is not set in repository secrets, so no work was dispatched."
            echo "Scheduled posts remain queued until it is added."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch due work
        if: env.CRON_SECRET != ''
        run: |
          set -uo pipefail

          fail=0
          for path in automation-publish social-publish; do
            # --max-time so a hung request cannot hold the runner for the full timeout.
            body=$(curl -sS --max-time 60 -w '\n%{http_code}' \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              "${BASE}/api/cron/${path}") || { echo "::error::${path}: request failed"; fail=1; continue; }

            code=$(printf '%s' "$body" | tail -n1)
            json=$(printf '%s' "$body" | sed '$d')

            case "$code" in
              200) echo "${path}: ${json}" ;;
              401) echo "::error::${path}: 401 — CRON_SECRET here does not match the one in Vercel"; fail=1 ;;
              # 503 is the route's own "engine threw" response. Worth surfacing, but not worth
              # failing the run: the next tick is five minutes away and retries by itself.
              503) echo "::warning::${path}: 503 — ${json}" ;;
              *)   echo "::error::${path}: unexpected ${code} — ${json}"; fail=1 ;;
            esac
          done

          exit $fail
